name: Deploy GlassTube Web
on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configure GlassTube web connection
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("web/config.js", "w", encoding="utf-8") as f:
              f.write("window.GLASSTUBE_CONFIG = { apiKey: " + json.dumps(os.environ.get("YT_API_KEY", "")) + " };")
          PY
      - name: Upload web site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy web site
        id: deployment
        uses: actions/deploy-pages@v4
